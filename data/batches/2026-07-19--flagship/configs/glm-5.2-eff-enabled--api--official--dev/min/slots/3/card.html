<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Atmospheric Field Report</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0c0a07;
  --fg: #f4ecda;
  --fg-dim: #b8ac96;
  --muted: #6e6557;
  --line: rgba(244, 236, 218, 0.08);
  --line-strong: rgba(244, 236, 218, 0.16);
  --accent: #ff8a3c;
  --accent-rgb: 255, 138, 60;
  --serif: 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', Palatino, Georgia, 'Times New Roman', serif;
  --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
  --mono: ui-monospace, 'SF Mono', 'JetBrains Mono', 'Roboto Mono', Menlo, Consolas, monospace;
}

html, body {
  background: #050402;
  color: var(--fg);
  font-family: var(--sans);
  -webkit-font-smoothing: antialiased;
  height: 100%;
  overflow: hidden;
}

body { display: flex; align-items: center; justify-content: center; }

.stage {
  width: 1280px;
  height: 800px;
  position: relative;
  overflow: hidden;
  background:
    radial-gradient(120% 80% at 88% -12%, rgba(var(--accent-rgb), 0.16), transparent 55%),
    radial-gradient(90% 70% at -10% 110%, rgba(var(--accent-rgb), 0.07), transparent 60%),
    linear-gradient(180deg, #0d0a07 0%, #070503 100%);
}

.atmosphere {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 1;
}

.frame {
  position: relative;
  z-index: 2;
  width: 100%;
  height: 100%;
  padding: 40px 56px;
  display: grid;
  grid-template-rows: auto 1fr auto auto;
  gap: 20px;
}

/* Header */
.head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--line);
  padding-bottom: 16px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 14px;
}

.brand-mark {
  width: 8px;
  height: 8px;
  background: var(--accent);
  border-radius: 50%;
  box-shadow: 0 0 14px var(--accent);
  animation: pulse 2.4s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.55; transform: scale(0.82); }
}

.brand-text {
  font-family: var(--sans);
  font-size: 10.5px;
  letter-spacing: 0.32em;
  text-transform: uppercase;
  color: var(--fg-dim);
  font-weight: 500;
}

.brand-text .sep { color: var(--muted); margin: 0 10px; }

.head-right {
  display: flex;
  align-items: center;
  gap: 22px;
  font-family: var(--mono);
  font-size: 10.5px;
  color: var(--muted);
  letter-spacing: 0.08em;
}

.head-right .live {
  display: flex;
  align-items: center;
  gap: 7px;
  color: var(--fg-dim);
}

.live-dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 8px var(--accent);
}

/* Body */
.body {
  display: grid;
  grid-template-columns: 1fr 1.32fr;
  gap: 56px;
  min-height: 0;
}

.left {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  min-width: 0;
}

.location-block { display: flex; flex-direction: column; gap: 4px; }

.eyebrow {
  font-size: 10.5px;
  letter-spacing: 0.32em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 500;
}

.location {
  font-family: var(--serif);
  font-size: 56px;
  font-weight: 400;
  line-height: 0.95;
  letter-spacing: -0.02em;
  color: var(--fg);
  margin-top: 6px;
}

.date-line {
  font-family: var(--mono);
  font-size: 11.5px;
  color: var(--fg-dim);
  letter-spacing: 0.08em;
  margin-top: 8px;
}

.temp-block { margin-top: 14px; }

.temp-main {
  display: flex;
  align-items: flex-start;
  gap: 4px;
  position: relative;
  margin-left: -8px;
}

.temp-value {
  font-family: var(--serif);
  font-size: 196px;
  font-weight: 400;
  line-height: 0.82;
  letter-spacing: -0.06em;
  background: linear-gradient(180deg, var(--fg) 18%, var(--accent) 110%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}

.temp-unit {
  font-family: var(--serif);
  font-size: 48px;
  line-height: 1;
  color: var(--accent);
  margin-top: 18px;
}

.condition-row {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-top: 12px;
}

.condition {
  font-family: var(--sans);
  font-size: 13.5px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--fg-dim);
  font-weight: 500;
}

.code-tag {
  font-family: var(--mono);
  font-size: 9.5px;
  color: var(--muted);
  letter-spacing: 0.12em;
  padding: 3px 7px;
  border: 1px solid var(--line-strong);
  border-radius: 2px;
}

.minmax {
  display: flex;
  gap: 36px;
  margin-top: 18px;
  padding-top: 18px;
  border-top: 1px solid var(--line);
}

.minmax-item { display: flex; flex-direction: column; gap: 5px; }

.minmax-label {
  font-size: 9.5px;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 500;
}

.minmax-value {
  font-family: var(--serif);
  font-size: 26px;
  color: var(--fg);
  line-height: 1;
}

.minmax-value .small {
  font-size: 13px;
  color: var(--muted);
  margin-left: 2px;
  font-family: var(--sans);
}

/* Right column */
.right {
  display: flex;
  flex-direction: column;
  gap: 14px;
  min-height: 0;
  min-width: 0;
}

.right-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
}

.right-meta {
  font-family: var(--mono);
  font-size: 10.5px;
  color: var(--muted);
  letter-spacing: 0.08em;
}

.chart-wrap {
  flex: 1;
  position: relative;
  background: linear-gradient(180deg, rgba(var(--accent-rgb), 0.04), transparent 80%);
  border: 1px solid var(--line);
  border-radius: 2px;
  padding: 16px 12px 8px;
  min-height: 0;
}

.chart-svg {
  width: 100%;
  height: 100%;
  display: block;
}

.chart-svg .g-label {
  font-family: var(--mono);
  font-size: 9px;
  fill: rgba(244, 236, 218, 0.45);
  letter-spacing: 0.04em;
}
.chart-svg .g-grid {
  font-family: var(--mono);
  font-size: 9px;
  fill: rgba(244, 236, 218, 0.38);
  letter-spacing: 0.04em;
}
.chart-svg .g-temp { font-family: var(--serif); font-style: italic; }
.chart-svg .g-temp-max { font-size: 13px; fill: var(--accent); }
.chart-svg .g-temp-min { font-size: 11px; fill: rgba(244, 236, 218, 0.55); }

/* Hourly strip */
.hourly-strip {
  border-top: 1px solid var(--line);
  padding-top: 12px;
}

.hourly-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 8px;
}

.hourly-grid {
  display: grid;
  grid-template-columns: repeat(24, 1fr);
}

.hour-cell {
  text-align: center;
  padding: 5px 0;
  border-right: 1px solid var(--line);
  transition: background 0.18s ease;
  position: relative;
}
.hour-cell:last-child { border-right: none; }
.hour-cell:hover { background: rgba(var(--accent-rgb), 0.10); }
.hour-cell:hover .hour-temp { color: var(--accent); }

.hour-time {
  font-family: var(--mono);
  font-size: 9px;
  color: var(--muted);
  letter-spacing: 0.04em;
}

.hour-temp {
  font-family: var(--serif);
  font-size: 14px;
  color: var(--fg);
  margin-top: 3px;
  line-height: 1;
  transition: color 0.18s ease;
}

/* Footer */
.foot {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-family: var(--mono);
  font-size: 9.5px;
  color: var(--muted);
  letter-spacing: 0.16em;
  text-transform: uppercase;
  border-top: 1px solid var(--line);
  padding-top: 14px;
}

.foot .accent { color: var(--accent); }

/* Error state */
.error-state {
  grid-column: 1 / -1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  height: 100%;
  text-align: center;
  padding: 0 80px;
}

.error-mark {
  width: 10px;
  height: 10px;
  background: var(--accent);
  border-radius: 50%;
  margin-bottom: 28px;
  box-shadow: 0 0 24px var(--accent);
  animation: pulse 1.8s ease-in-out infinite;
}

.error-title {
  font-family: var(--serif);
  font-size: 64px;
  letter-spacing: -0.02em;
  line-height: 1;
  margin: 14px 0 18px;
  color: var(--fg);
}

.error-msg {
  font-size: 14px;
  color: var(--fg-dim);
  max-width: 580px;
  line-height: 1.7;
}

.error-msg strong { color: var(--fg); font-weight: 500; }

.error-detail {
  margin-top: 26px;
  font-family: var(--mono);
  font-size: 10.5px;
  color: var(--muted);
  letter-spacing: 0.08em;
  padding: 12px 18px;
  border: 1px solid var(--line);
  border-radius: 2px;
  max-width: 640px;
  word-break: break-all;
}

/* Loading state */
.loading-state {
  grid-column: 1 / -1;
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100%;
  flex-direction: column;
  gap: 16px;
}

.loading-text {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--muted);
  animation: loading-pulse 1.6s ease-in-out infinite;
}

@keyframes loading-pulse {
  0%, 100% { opacity: 0.35; }
  50% { opacity: 1; }
}

/* Reveal */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

.reveal { animation: fadeUp 0.6s cubic-bezier(0.2, 0.7, 0.2, 1) forwards; opacity: 0; }
.reveal-1 { animation-delay: 0.05s; }
.reveal-2 { animation-delay: 0.15s; }
.reveal-3 { animation-delay: 0.25s; }
.reveal-4 { animation-delay: 0.35s; }
.reveal-5 { animation-delay: 0.45s; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}
</style>
</head>
<body>
<div class="stage">
  <canvas class="atmosphere" id="atmosphere"></canvas>
  <div class="frame" id="frame">
    <div class="loading-state">
      <div class="loading-text">Initializing atmospheric report…</div>
    </div>
  </div>
</div>

<script>
const params = new URLSearchParams(location.search);
const lat = parseFloat(params.get('lat') ?? '52.52');
const lon = parseFloat(params.get('lon') ?? '13.405');
const nameParam = params.get('name') ?? 'Berlin';
const dateParam = params.get('date');
const todayUTC = new Date().toISOString().slice(0, 10);
const date = dateParam && /^\d{4}-\d{2}-\d{2}$/.test(dateParam) ? dateParam : todayUTC;

const isPast = date < todayUTC;
const endpoint = isPast ? '/api/om/archive' : '/api/om/forecast';

const qs = new URLSearchParams({
  latitude: lat.toString(),
  longitude: lon.toString(),
  daily: 'temperature_2m_max,temperature_2m_min,weather_code',
  hourly: 'temperature_2m',
  timezone: 'UTC',
  temperature_unit: 'celsius',
  start_date: date,
  end_date: date
});

const apiUrl = `${endpoint}?${qs.toString()}`;

const WMO = {
  0:  { label: 'Clear sky',                  family: 'clear' },
  1:  { label: 'Mainly clear',               family: 'clear' },
  2:  { label: 'Partly cloudy',              family: 'partly' },
  3:  { label: 'Overcast',                   family: 'cloudy' },
  45: { label: 'Fog',                        family: 'fog' },
  48: { label: 'Depositing rime fog',        family: 'fog' },
  51: { label: 'Light drizzle',              family: 'drizzle' },
  53: { label: 'Moderate drizzle',           family: 'drizzle' },
  55: { label: 'Dense drizzle',              family: 'drizzle' },
  56: { label: 'Light freezing drizzle',     family: 'drizzle' },
  57: { label: 'Dense freezing drizzle',     family: 'drizzle' },
  61: { label: 'Slight rain',                family: 'rain' },
  63: { label: 'Moderate rain',              family: 'rain' },
  65: { label: 'Heavy rain',                 family: 'rain' },
  66: { label: 'Light freezing rain',        family: 'rain' },
  67: { label: 'Heavy freezing rain',        family: 'rain' },
  71: { label: 'Slight snowfall',            family: 'snow' },
  73: { label: 'Moderate snowfall',          family: 'snow' },
  75: { label: 'Heavy snowfall',             family: 'snow' },
  77: { label: 'Snow grains',                family: 'snow' },
  80: { label: 'Slight rain showers',        family: 'rain' },
  81: { label: 'Moderate rain showers',      family: 'rain' },
  82: { label: 'Violent rain showers',       family: 'rain' },
  85: { label: 'Slight snow showers',        family: 'snow' },
  86: { label: 'Heavy snow showers',         family: 'snow' },
  95: { label: 'Thunderstorm',               family: 'storm' },
  96: { label: 'Thunderstorm, slight hail',  family: 'storm' },
  99: { label: 'Thunderstorm, heavy hail',   family: 'storm' }
};

function accentForTemp(t) {
  if (t == null || Number.isNaN(t)) return '#ff8a3c';
  if (t <= -10) return '#7dd3fc';
  if (t <= 0)   return '#a5e8e0';
  if (t <= 8)   return '#cfe8b8';
  if (t <= 18)  return '#ffd07a';
  if (t <= 26)  return '#ff8a3c';
  return '#ff5a3c';
}

function hexToRgb(hex) {
  hex = hex.replace('#', '');
  return [
    parseInt(hex.slice(0, 2), 16),
    parseInt(hex.slice(2, 4), 16),
    parseInt(hex.slice(4, 6), 16)
  ].join(', ');
}

function formatDateLong(d) {
  const dt = new Date(d + 'T00:00:00Z');
  const opts = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', timeZone: 'UTC' };
  return dt.toLocaleDateString('en-US', opts);
}

function formatCoord(lat, lon) {
  const latDir = lat >= 0 ? 'N' : 'S';
  const lonDir = lon >= 0 ? 'E' : 'W';
  return `${Math.abs(lat).toFixed(3)}°${latDir} · ${Math.abs(lon).toFixed(3)}°${lonDir}`;
}

function escapeHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
}

function smoothPath(points) {
  if (points.length < 2) return '';
  const p = points;
  let d = `M ${p[0][0].toFixed(2)} ${p[0][1].toFixed(2)}`;
  const t = 0.18;
  for (let i = 0; i < p.length - 1; i++) {
    const p0 = p[i - 1] || p[i];
    const p1 = p[i];
    const p2 = p[i + 1];
    const p3 = p[i + 2] || p2;
    const cp1x = p1[0] + (p2[0] - p0[0]) * t;
    const cp1y = p1[1] + (p2[1] - p0[1]) * t;
    const cp2x = p2[0] - (p3[0] - p1[0]) * t;
    const cp2y = p2[1] - (p3[1] - p1[1]) * t;
    d += ` C ${cp1x.toFixed(2)} ${cp1y.toFixed(2)}, ${cp2x.toFixed(2)} ${cp2y.toFixed(2)}, ${p2[0].toFixed(2)} ${p2[1].toFixed(2)}`;
  }
  return d;
}

function buildChart(hours, temps, accent, W, H) {
  W = Math.max(200, W);
  H = Math.max(150, H);
  const padL = 38, padR = 16, padT = 26, padB = 26;
  const innerW = W - padL - padR;
  const innerH = H - padT - padB;

  const tMin = Math.min(...temps);
  const tMax = Math.max(...temps);
  const range = Math.max(0.5, tMax - tMin);
  const pad = range * 0.22;
  const yMin = tMin - pad;
  const yMax = tMax + pad;
  const yRange = Math.max(0.5, yMax - yMin);

  const xStep = innerW / Math.max(1, hours.length - 1);

  const points = temps.map((t, i) => {
    const x = padL + i * xStep;
    const y = padT + (1 - (t - yMin) / yRange) * innerH;
    return [x, y];
  });

  const path = smoothPath(points);
  const lastPt = points[points.length - 1];
  const firstPt = points[0];
  const areaPath = path +
    ` L ${lastPt[0].toFixed(2)} ${(H - padB).toFixed(2)}` +
    ` L ${firstPt[0].toFixed(2)} ${(H - padB).toFixed(2)} Z`;

  let gridLines = '';
  const gridCount = 4;
  for (let i = 0; i <= gridCount; i++) {
    const y = padT + (i / gridCount) * innerH;
    const val = yMax - (i / gridCount) * yRange;
    gridLines += `<line x1="${padL}" y1="${y.toFixed(2)}" x2="${(W - padR).toFixed(2)}" y2="${y.toFixed(2)}" stroke="rgba(244,236,218,0.05)" stroke-width="1"/>`;
    gridLines += `<text x="${(padL - 8).toFixed(2)}" y="${(y + 3).toFixed(2)}" text-anchor="end" class="g-grid">${val.toFixed(0)}°</text>`;
  }

  let xLabels = '';
  hours.forEach((h, i) => {
    if (i % 3 !== 0 && i !== hours.length - 1) return;
    const hh = h.split('T')[1].slice(0, 2);
    const x = padL + i * xStep;
    xLabels += `<text x="${x.toFixed(2)}" y="${(H - 9).toFixed(2)}" text-anchor="middle" class="g-label">${hh}h</text>`;
  });

  let dots = '';
  points.forEach(([x, y], i) => {
    if (i % 3 !== 0 && i !== points.length - 1) return;
    dots += `<circle cx="${x.toFixed(2)}" cy="${y.toFixed(2)}" r="2.2" fill="${accent}" opacity="0.95"/>`;
  });

  const maxIdx = temps.indexOf(tMax);
  const minIdx = temps.indexOf(tMin);
  const peak = `
    <line x1="${points[maxIdx][0].toFixed(2)}" y1="${points[maxIdx][1].toFixed(2)}" x2="${points[maxIdx][0].toFixed(2)}" y2="${(H - padB).toFixed(2)}" stroke="${accent}" stroke-width="1" stroke-dasharray="2 3" opacity="0.4"/>
    <line x1="${points[minIdx][0].toFixed(2)}" y1="${points[minIdx][1].toFixed(2)}" x2="${points[minIdx][0].toFixed(2)}" y2="${(H - padB).toFixed(2)}" stroke="rgba(244,236,218,0.3)" stroke-width="1" stroke-dasharray="2 3" opacity="0.4"/>
    <circle cx="${points[maxIdx][0].toFixed(2)}" cy="${points[maxIdx][1].toFixed(2)}" r="4.5" fill="none" stroke="${accent}" stroke-width="1.2" opacity="0.95"/>
    <text x="${points[maxIdx][0].toFixed(2)}" y="${(points[maxIdx][1] - 11).toFixed(2)}" text-anchor="middle" class="g-temp g-temp-max">${tMax.toFixed(1)}°</text>
    <circle cx="${points[minIdx][0].toFixed(2)}" cy="${points[minIdx][1].toFixed(2)}" r="3.5" fill="none" stroke="rgba(244,236,218,0.5)" stroke-width="1"/>
    <text x="${points[minIdx][0].toFixed(2)}" y="${(points[minIdx][1] + 17).toFixed(2)}" text-anchor="middle" class="g-temp g-temp-min">${tMin.toFixed(1)}°</text>
  `;

  return `
    <svg class="chart-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
      <defs>
        <linearGradient id="area-grad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="${accent}" stop-opacity="0.34"/>
          <stop offset="100%" stop-color="${accent}" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="line-grad" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="${accent}" stop-opacity="0.55"/>
          <stop offset="50%" stop-color="${accent}" stop-opacity="1"/>
          <stop offset="100%" stop-color="${accent}" stop-opacity="0.55"/>
        </linearGradient>
      </defs>
      ${gridLines}
      <path d="${areaPath}" fill="url(#area-grad)"/>
      <path d="${path}" fill="none" stroke="url(#line-grad)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
      ${peak}
      ${dots}
      ${xLabels}
    </svg>
  `;
}

function render(d) {
  const accent = accentForTemp(d.tMax);
  document.documentElement.style.setProperty('--accent', accent);
  document.documentElement.style.setProperty('--accent-rgb', hexToRgb(accent));

  const frame = document.getElementById('frame');

  const cells = d.hours.map((h, i) => {
    const hh = h.split('T')[1].slice(0, 2);
    return `
      <div class="hour-cell" data-i="${i}">
        <div class="hour-time">${hh}</div>
        <div class="hour-temp">${Math.round(d.temps[i])}°</div>
      </div>`;
  }).join('');

  const range = (d.tMax - d.tMin).toFixed(1);
  const coordStr = formatCoord(d.lat, d.lon);
  const generated = new Date().toISOString().slice(0, 19).replace('T', ' ');

  frame.innerHTML = `
    <header class="head reveal reveal-1">
      <div class="brand">
        <span class="brand-mark"></span>
        <span class="brand-text">Atmospheric Field Report<span class="sep">·</span>${d.isPast ? 'Archive Retrieval' : 'Forecast Observation'}</span>
      </div>
      <div class="head-right">
        <span>${coordStr}</span>
        <span class="live"><span class="live-dot"></span>UTC</span>
      </div>
    </header>

    <main class="body">
      <section class="left reveal reveal-2">
        <div class="location-block">
          <div class="eyebrow">Location</div>
          <h1 class="location">${escapeHtml(d.name)}</h1>
          <div class="date-line">${formatDateLong(d.date)}</div>
        </div>

        <div class="temp-block">
          <div class="temp-main">
            <span class="temp-value">${Math.round(d.tMax)}</span>
            <span class="temp-unit">°C</span>
          </div>
          <div class="condition-row">
            <span class="condition">${d.wmo.label}</span>
            <span class="code-tag">WMO ${d.code}</span>
          </div>
          <div class="minmax">
            <div class="minmax-item">
              <span class="minmax-label">High</span>
              <span class="minmax-value">${d.tMax.toFixed(1)}<span class="small">°C</span></span>
            </div>
            <div class="minmax-item">
              <span class="minmax-label">Low</span>
              <span class="minmax-value">${d.tMin.toFixed(1)}<span class="small">°C</span></span>
            </div>
            <div class="minmax-item">
              <span class="minmax-label">Range</span>
              <span class="minmax-value">${range}<span class="small">°C</span></span>
            </div>
          </div>
        </div>
      </section>

      <section class="right reveal reveal-3">
        <div class="right-head">
          <span class="eyebrow">Hourly Temperature · 24h Trace</span>
          <span class="right-meta">${d.hours.length} readings · °C</span>
        </div>
        <div class="chart-wrap" id="chartWrap"></div>
      </section>
    </main>

    <section class="hourly-strip reveal reveal-4">
      <div class="hourly-head">
        <span class="eyebrow">Hourly Breakdown</span>
        <span class="right-meta">00h → 23h UTC</span>
      </div>
      <div class="hourly-grid">${cells}</div>
    </section>

    <footer class="foot reveal reveal-5">
      <span>Source · Open-Meteo · <span class="accent">${d.isPast ? 'Archive API' : 'Forecast API'}</span></span>
      <span>Generated ${generated} UTC</span>
    </footer>
  `;

  // Build chart after layout settles, so we can size to container
  requestAnimationFrame(() => {
    const wrap = document.getElementById('chartWrap');
    if (wrap) {
      const rect = wrap.getBoundingClientRect();
      const cw = Math.max(200, Math.round(rect.width - 24));
      const ch = Math.max(150, Math.round(rect.height - 24));
      wrap.innerHTML = buildChart(d.hours, d.temps, accent, cw, ch);
    }
    startAtmosphere(d.wmo.family, accent);
  });
}

function renderError(e) {
  document.documentElement.style.setProperty('--accent', '#ff8a3c');
  document.documentElement.style.setProperty('--accent-rgb', '255, 138, 60');
  const frame = document.getElementById('frame');
  frame.innerHTML = `
    <div class="error-state">
      <div class="error-mark"></div>
      <div class="eyebrow">Signal Lost · Report Unavailable</div>
      <h1 class="error-title">The atmosphere is silent.</h1>
      <p class="error-msg">
        Weather data for <strong>${escapeHtml(nameParam)}</strong> on <strong>${escapeHtml(date)}</strong> could not be retrieved.
        The observation service may be unreachable, the requested date may fall outside the available range,
        or the coordinates may be invalid.
      </p>
      <div class="error-detail">${escapeHtml(e.message || 'Unknown error')} &nbsp;·&nbsp; ${escapeHtml(apiUrl)}</div>
    </div>`;
  startAtmosphere('clear', '#ff8a3c');
}

async function init() {
  try {
    const res = await fetch(apiUrl);
    if (!res.ok) throw new Error(`HTTP ${res.status} ${res.statusText}`);
    const data = await res.json();

    const daily = data.daily;
    const hourly = data.hourly;

    if (!daily || !hourly) throw new Error('Incomplete response: missing daily or hourly data');
    if (!Array.isArray(daily.temperature_2m_max) || daily.temperature_2m_max.length === 0)
      throw new Error('No daily data returned for the requested date');
    if (!Array.isArray(hourly.temperature_2m) || hourly.temperature_2m.length === 0)
      throw new Error('No hourly data returned for the requested date');

    const tMax = daily.temperature_2m_max[0];
    const tMin = daily.temperature_2m_min[0];
    const code = daily.weather_code[0];

    if (tMax == null || tMin == null)
      throw new Error('Temperature values are null for the requested date');

    const hours = hourly.time;
    const temps = hourly.temperature_2m;
    const wmo = WMO[code] ?? { label: 'Unknown conditions', family: 'clear' };

    render({ name: nameParam, date, lat, lon, tMax, tMin, code, wmo, hours, temps, isPast });
  } catch (e) {
    console.error(e);
    renderError(e);
  }
}

function startAtmosphere(family, accent) {
  const canvas = document.getElementById('atmosphere');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const W = 1280, H = 800;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  const accentRgb = hexToRgb(accent);
  let particles = [];
  const rand = (min, max) => min + Math.random() * (max - min);

  if (family === 'rain' || family === 'drizzle') {
    const count = family === 'drizzle' ? 90 : 180;
    particles = Array.from({ length: count }, () => ({
      x: rand(0, W), y: rand(-H, H),
      vy: rand(5, 9), vx: rand(0.6, 1.2),
      len: rand(10, 20), a: rand(0.15, 0.4)
    }));
  } else if (family === 'snow') {
    particles = Array.from({ length: 80 }, () => ({
      x: rand(0, W), y: rand(-H, H),
      vy: rand(0.4, 1.1), vx: rand(-0.4, 0.4),
      r: rand(1, 2.6), a: rand(0.4, 0.85),
      drift: rand(0, Math.PI * 2), driftSpeed: rand(0.01, 0.03)
    }));
  } else if (family === 'fog') {
    particles = Array.from({ length: 8 }, () => ({
      x: rand(-200, W), y: rand(H * 0.2, H * 0.95),
      r: rand(180, 320), vx: rand(0.15, 0.4),
      a: rand(0.04, 0.09)
    }));
  } else if (family === 'storm') {
    particles = Array.from({ length: 220 }, () => ({
      x: rand(0, W), y: rand(-H, H),
      vy: rand(6, 11), vx: rand(0.8, 1.6),
      len: rand(12, 22), a: rand(0.2, 0.5)
    }));
  } else if (family === 'cloudy' || family === 'partly') {
    particles = Array.from({ length: 5 }, () => ({
      x: rand(-200, W), y: rand(40, 320),
      r: rand(140, 260), vx: rand(0.12, 0.28),
      a: rand(0.04, 0.08)
    }));
  } else {
    particles = Array.from({ length: 70 }, () => ({
      x: rand(0, W), y: rand(0, H),
      r: rand(0.4, 1.4), a: rand(0.08, 0.32),
      twinkle: rand(0, Math.PI * 2), twinkleSpeed: rand(0.008, 0.025)
    }));
  }

  let flashOpacity = 0;
  let nextFlashAt = performance.now() + rand(2000, 5000);

  function frame(t) {
    ctx.clearRect(0, 0, W, H);

    if (family === 'rain' || family === 'drizzle' || family === 'storm') {
      ctx.strokeStyle = `rgba(${accentRgb}, 0.9)`;
      ctx.lineWidth = 1;
      ctx.lineCap = 'round';
      for (const p of particles) {
        ctx.globalAlpha = p.a;
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(p.x - p.vx * 1.5, p.y + p.len);
        ctx.stroke();
        p.x += p.vx;
        p.y += p.vy;
        if (p.y > H + 10) { p.y = -10; p.x = rand(0, W); }
        if (p.x > W + 10) p.x = -10;
      }
      if (family === 'storm') {
        if (t > nextFlashAt) {
          flashOpacity = 0.32;
          nextFlashAt = t + rand(2800, 6500);
        }
        if (flashOpacity > 0.005) {
          ctx.globalAlpha = flashOpacity;
          ctx.fillStyle = '#f4ecda';
          ctx.fillRect(0, 0, W, H);
          flashOpacity *= 0.82;
        }
      }
    } else if (family === 'snow') {
      ctx.fillStyle = '#f4ecda';
      for (const p of particles) {
        p.drift += p.driftSpeed;
        p.x += p.vx + Math.sin(p.drift) * 0.4;
        p.y += p.vy;
        if (p.y > H + 5) { p.y = -5; p.x = rand(0, W); }
        if (p.x > W + 5) p.x = -5;
        if (p.x < -5) p.x = W + 5;
        ctx.globalAlpha = p.a;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
      }
    } else if (family === 'fog' || family === 'cloudy' || family === 'partly') {
      for (const p of particles) {
        p.x += p.vx;
        if (p.x > W + p.r) p.x = -p.r;
        const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r);
        grad.addColorStop(0, `rgba(244, 236, 218, ${p.a})`);
        grad.addColorStop(1, 'rgba(244, 236, 218, 0)');
        ctx.globalAlpha = 1;
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
      }
    } else {
      ctx.fillStyle = '#f4ecda';
      for (const p of particles) {
        p.twinkle += p.twinkleSpeed;
        const a = p.a * (0.35 + 0.65 * (0.5 + 0.5 * Math.sin(p.twinkle)));
        ctx.globalAlpha = a;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    ctx.globalAlpha = 1;
    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
}

init();
</script>
</body>
</html>
