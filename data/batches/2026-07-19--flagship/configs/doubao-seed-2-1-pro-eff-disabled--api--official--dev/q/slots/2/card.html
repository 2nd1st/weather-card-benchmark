<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Weather Card</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1280px;
    height: 800px;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: radial-gradient(circle at 30% 20%, #5b8bd6 0%, #2c4e8e 45%, #13214a 100%);
    color: #ffffff;
  }
  .card {
    width: 1280px;
    height: 800px;
    padding: 50px 70px;
    position: relative;
    display: flex;
    flex-direction: column;
  }
  .card::before {
    content: "";
    position: absolute;
    top: -80px; right: -80px;
    width: 360px; height: 360px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,220,130,0.35) 0%, rgba(255,220,130,0) 70%);
    pointer-events: none;
  }
  .card::after {
    content: "";
    position: absolute;
    bottom: -120px; left: -100px;
    width: 500px; height: 500px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(110,180,255,0.25) 0%, rgba(110,180,255,0) 70%);
    pointer-events: none;
  }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 40px;
    position: relative;
    z-index: 1;
  }
  .location {
    font-size: 48px;
    font-weight: 600;
    letter-spacing: -0.5px;
    text-shadow: 0 2px 10px rgba(0,0,0,0.2);
  }
  .date-block {
    text-align: right;
  }
  .date-label {
    font-size: 22px;
    font-weight: 500;
    opacity: 0.9;
  }
  .date-sub {
    font-size: 16px;
    opacity: 0.7;
    margin-top: 4px;
  }

  .main {
    display: flex;
    gap: 60px;
    align-items: center;
    margin-bottom: 40px;
    position: relative;
    z-index: 1;
  }

  .icon-box {
    width: 220px;
    height: 220px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 30px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }
  .icon-box svg {
    width: 160px;
    height: 160px;
  }

  .temps {
    flex: 1;
  }
  .condition {
    font-size: 28px;
    font-weight: 500;
    opacity: 0.95;
    margin-bottom: 18px;
    letter-spacing: 0.3px;
  }
  .temp-range {
    display: flex;
    align-items: baseline;
    gap: 24px;
    margin-bottom: 14px;
  }
  .temp-high {
    font-size: 96px;
    font-weight: 300;
    line-height: 1;
    letter-spacing: -3px;
  }
  .temp-low {
    font-size: 48px;
    font-weight: 300;
    opacity: 0.7;
  }
  .temp-unit { font-size: 24px; vertical-align: super; margin-left: 4px; opacity: 0.8; }

  .summary {
    font-size: 18px;
    opacity: 0.75;
    margin-top: 8px;
  }

  .hourly {
    margin-top: auto;
    position: relative;
    z-index: 1;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 24px;
    padding: 24px 28px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }
  .hourly-title {
    font-size: 16px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 2px;
    opacity: 0.7;
    margin-bottom: 18px;
  }
  .hourly-scroll {
    display: grid;
    grid-template-columns: repeat(24, 1fr);
    gap: 8px;
  }
  .hour {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  .hour-time {
    font-size: 14px;
    opacity: 0.7;
    font-weight: 500;
  }
  .hour-bar-wrap {
    width: 100%;
    height: 80px;
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }
  .hour-bar {
    width: 14px;
    min-height: 4px;
    border-radius: 7px;
    background: linear-gradient(to top, #63b3ff, #ffd76b);
    box-shadow: 0 0 12px rgba(255,215,107,0.35);
    transition: height 0.4s ease;
  }
  .hour-temp {
    font-size: 15px;
    font-weight: 600;
  }

  .error {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    font-weight: 500;
    opacity: 0.9;
    text-align: center;
    padding: 40px;
  }
  .loading {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    opacity: 0.8;
  }
</style>
</head>
<body>
<div class="card" id="card">
  <div class="loading">Loading weather…</div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const lat = parseFloat(params.get('lat')) || 52.52;
const lon = parseFloat(params.get('lon')) || 13.405;
const name = params.get('name') || 'Berlin';
let dateParam = params.get('date');
if (!dateParam) {
  const d = new Date();
  const y = d.getUTCFullYear();
  const m = String(d.getUTCMonth() + 1).padStart(2, '0');
  const day = String(d.getUTCDate()).padStart(2, '0');
  dateParam = `${y}-${m}-${day}`;
}
const reqDate = dateParam;

const today = new Date();
const todayStr = `${today.getUTCFullYear()}-${String(today.getUTCMonth()+1).padStart(2,'0')}-${String(today.getUTCDate()).padStart(2,'0')}`;

const endpoint = isPast ? '/api/om/archive' : '/api/om/forecast';

const url = `${endpoint}?latitude=${lat}&longitude=${lon}&daily=temperature_2m_max,temperature_2m_min,weather_code&hourly=temperature_2m&timezone=UTC&temperature_unit=celsius&start_date=${reqDate}&end_date=${reqDate}`;
