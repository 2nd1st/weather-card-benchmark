<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Weather Card</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .weather-card {
            width: 900px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            overflow: hidden;
        }

        .location-section {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 32px;
        }

        .location-info h1 {
            font-size: 32px;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 8px;
        }

        .date {
            font-size: 18px;
            color: #64748b;
            font-weight: 500;
        }

        .current-weather {
            display: flex;
            align-items: center;
            gap: 24px;
            margin-bottom: 40px;
            padding: 24px;
            background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
            border-radius: 16px;
        }

        .weather-icon {
            width: 80px;
            height: 80px;
        }

        .temp-display {
            flex: 1;
        }

        .weather-condition {
            font-size: 24px;
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 12px;
        }

        .temp-range {
            display: flex;
            gap: 24px;
        }

        .temp-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 18px;
        }

        .temp-high {
            color: #dc2626;
            font-weight: 600;
        }

        .temp-low {
            color: #2563eb;
            font-weight: 600;
        }

        .hourly-section {
            margin-top: 32px;
        }

        .hourly-title {
            font-size: 20px;
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 20px;
        }

        .hourly-scroll {
            display: flex;
            gap: 16px;
            overflow-x: auto;
            padding-bottom: 8px;
            scrollbar-width: thin;
            scrollbar-color: #cbd5e1 #f1f5f9;
        }

        .hourly-scroll::-webkit-scrollbar {
            height: 6px;
        }

        .hourly-scroll::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 3px;
        }

        .hourly-scroll::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }

        .hourly-item {
            flex-shrink: 0;
            width: 70px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            padding: 16px 8px;
            background: #f8fafc;
            border-radius: 12px;
            transition: all 0.2s ease;
        }

        .hourly-item:hover {
            background: #e2e8f0;
            transform: translateY(-2px);
        }

        .hour {
            font-size: 14px;
            font-weight: 500;
            color: #64748b;
        }

        .hourly-icon {
            width: 32px;
            height: 32px;
        }

        .hourly-temp {
            font-size: 16px;
            font-weight: 600;
            color: #1e293b;
        }

        .error-state {
            text-align: center;
            padding: 60px 40px;
            color: #dc2626;
        }

        .error-icon {
            font-size: 64px;
            margin-bottom: 16px;
        }

        .error-message {
            font-size: 20px;
            font-weight: 500;
        }

        .loading {
            text-align: center;
            padding: 60px;
            color: #64748b;
        }

        .loading-spinner {
            width: 48px;
            height: 48px;
            border: 4px solid #e2e8f0;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .hidden {
            display: none;
        }
    </style>
</head>
