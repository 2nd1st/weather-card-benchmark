[project]
name = "weather-card-benchmark-runner"
version = "0.0.0"
description = "Deterministic sampling / render / L1-L3 similarity runner for the weather-card benchmark."
requires-python = ">=3.11"
authors = [{ name = "LEOYUN", email = "leo@secondfirst.ai" }]
dependencies = [
    "requests",
    "playwright",
    "pytest",
    "pyyaml",
    "jsonschema",
    "rfc8785",  # RFC 8785 JCS canonicalization (manifest_hash); available on PyPI
    "numpy",  # Generator(PCG64(seed_assign)) for the Ω_c assignment draw (scheme §1.2)
    "scipy",  # scipy.fft.dctn(type=2, norm="ortho") for v-phash (appendix A, scipy 钉版)
    "pillow",  # image decode / LANCZOS resize for visual channels (appendix A imaging)
    "scikit-image",  # skimage.metrics.structural_similarity for v-ssim (appendix A, 钉版)
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# The CLI-harness home dirs (_codex_home*, _grok_home, …) are throwaway caches
# the harness arms write into, and they contain VENDORED third-party plugin test
# suites. Collecting those made `pytest -q` from the repo root report failures in
# code this project does not own and cannot fix.
norecursedirs = [
    "_codex_home", "_codex_home_oauth", "_grok_home", "_kiro_home",
    "_opencode_home", "_postcss", "_ast_js_node", "node_modules",
    ".venv", "__pycache__",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Runner is executed in-place (python -m runner...), not installed as a wheel.
py-modules = []
