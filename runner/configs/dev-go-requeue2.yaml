# dev-go-requeue2.yaml — go 网关 api 臂定向补跑。
# unified 中 14 个模型只有 opencode harness 席、无 go api 席;本批补其中 13 个
# (hy3-preview 为网关侧 400,不可补)。顺序串行(runner 天然并发=1),
# 单席失败照常记录(model/infra_error, m<N)不阻断整批 —— "允许 api error 但把任务跑完"。
version: 1
N: 2
transport:
  base_url: https://opencode.ai/zen/go/v1
  descriptor: opencode-go-gateway
  proxy: none
configs:
  - config_id: deepseek-v4-flash--opencode-go--dev
    family: deepseek
    model_id: deepseek-v4-flash
    effort: null
    effort_param: null
    protocol: api
    billing: plan
    auth: { method: oauth, credential_ref: WCB_OPENCODE_KEY }
