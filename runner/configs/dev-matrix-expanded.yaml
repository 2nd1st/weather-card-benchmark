# dev-matrix-expanded.yaml — 12-config DEV matrix (gpt×7 + grok×5) via sub2api.
# DEV ONLY(gitignored batches-dev,永不发布);目的:让 /matrix 有可看的
# 家族聚类 + effort 聚类。N=2(dev 放宽)。
version: 1
N: 2

transport:
  base_url: http://localhost:8080/v1
  descriptor: sub2api-dev-gateway
  proxy: sub2api

configs:
  # ---- GPT family:sol 三档 effort + 三个 tier + 上代 mini ----
  - config_id: gpt-5.6-sol-eff-low--api--raw--dev
    family: gpt
    model_id: gpt-5.6-sol
    effort: low
    effort_param: reasoning.effort
    protocol: api
    billing: plan  # sub2 订阅账号(dev)
    auth: { method: api-key, credential_ref: WCB_GPT_KEY }

  - config_id: gpt-5.6-sol-eff-medium--api--raw--dev
    family: gpt
    model_id: gpt-5.6-sol
    effort: medium
    effort_param: reasoning.effort
    protocol: api
    billing: plan  # sub2 订阅账号(dev)
    auth: { method: api-key, credential_ref: WCB_GPT_KEY }

  - config_id: gpt-5.6-sol-eff-high--api--raw--dev
