version: 1
N: 4

transport:
  base_url: https://ark.cn-beijing.volces.com/api/v3
  descriptor: volcano-ark-official-api
  proxy: none

configs:
  - config_id: doubao-seed-2-1-pro-eff-disabled--api--official--dev
    family: doubao
    model_id: doubao-seed-2-1-pro-260628
