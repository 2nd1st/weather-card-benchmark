    effort_param: thinking.type
    protocol: api
    billing: metered
    auth: { method: api-key, credential_ref: WCB_ARK_KEY }

  - config_id: doubao-seed-2-1-pro-eff-enabled--api--official--dev
    family: doubao
    model_id: doubao-seed-2-1-pro-260628
