# dev-official-gpt.yaml — OpenAI 官方 API 全量(/responses)。N=4 正式规格。
# 档位表 = 行为实证(逐档探测,2026-07-18):minimal 全系 400;max 仅 5.6 系;5.2-codex 无 none。
version: 1
N: 4

transport:
  base_url: https://api.openai.com/v1
  descriptor: openai-official-api
  proxy: none
  background: true   # /responses background+poll(官方 SSE 长 reasoning 断流实证)

