# dev-opencode-cli.yaml — opencode CLI harness,go 订阅 16 模型(默认档)。
# 隔离 XDG home(0 用户配置,实证);provider 指第一方 go 端点(CLI zen 计费线不认 go 订阅)。
version: 1
N: 2

transport:
  base_url: local-cli
  descriptor: opencode-cli-isolated-xdg-go-subscription
  proxy: none

configs:
  - config_id: minimax-m3--cli--opencode--dev
    family: minimax
    model_id: minimax-m3
    effort: null
    effort_param: null
    protocol: cli
    harness: opencode
    billing: plan
    auth: { method: oauth-login, credential_ref: WCB_OPENCODE_KEY }

